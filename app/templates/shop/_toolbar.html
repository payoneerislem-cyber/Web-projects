{% from "partials/_icons.html" import icon %}
<div class="listing-toolbar">
  <p class="result-count" role="status">{{ products.total }} result{{ '' if products.total == 1 else 's' }}</p>
  <div class="toolbar-actions">
    <button type="button" class="btn btn-secondary btn-sm filters-toggle" data-filters-open aria-controls="filters" aria-expanded="false">
      {{ icon('sliders', 16) }} Filters{% if active_count %} <span class="badge badge-primary">{{ active_count }}</span>{% endif %}
    </button>
    <div class="sort">
      <label for="sort-select" class="visually-hidden">Sort by</label>
      <select id="sort-select" class="input input-sm" name="sort" form="filters-form" data-autosubmit>
        {% for value, label in sort_options %}<option value="{{ value }}"{% if value == filters.sort %} selected{% endif %}>{{ label }}</option>{% endfor %}
      </select>
      <noscript><button type="submit" form="filters-form" class="btn btn-secondary btn-sm">Sort</button></noscript>
    </div>
  </div>
</div>
{% if chips %}
<div class="chips" aria-label="Active filters">
  {% for label, url in chips %}
  <a class="chip" href="{{ url }}" aria-label="Remove filter: {{ label }}">{{ label }} {{ icon('x', 14) }}</a>
  {% endfor %}
  <a class="chip-clear" href="{{ clear_url }}">Clear all</a>
</div>
{% endif %}
