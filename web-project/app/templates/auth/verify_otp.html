{% extends "base.html" %}
{% block title %}Verify OTP — {{ app_name }}{% endblock %}
{% block styles %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block body %}
<main class="auth-card">
    <h1>Verify OTP Code 🔢</h1>
    {% include "components/_flash_messages.html" %}

    <form action="{{ url_for('auth.verify_otp') }}" method="post" class="auth-form">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="form-group center-label">
            <label for="otp_code">6-digit verification code</label>
            <input id="otp_code" type="text" name="otp_code" placeholder="123456" maxlength="6" inputmode="numeric" pattern="[0-9]{6}" required autocomplete="one-time-code">
        </div>
        <button type="submit" class="btn btn-danger">Verify Code</button>
    </form>

    <p class="footer-link"><a href="{{ url_for('auth.reset_request') }}">← Resend Code / Back</a></p>
</main>
{% endblock %}
