{% extends "base.html" %}
{% block title %}Create Account — {{ app_name }}{% endblock %}
{% block styles %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block body %}
<main class="auth-card">
    <h1>Create Account 👤</h1>
    {% include "components/_flash_messages.html" %}

    <form action="{{ url_for('auth.register') }}" method="post" class="auth-form">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" placeholder="Choose a username" required minlength="3" autocomplete="username">
        </div>
        <div class="form-group">
            <label for="email">Email address</label>
            <input id="email" type="email" name="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>

    <p class="footer-link"><a href="{{ url_for('auth.login') }}">← Back to Login</a></p>
</main>
{% endblock %}
