{% extends "base.html" %}
{% block title %}New Password — {{ app_name }}{% endblock %}
{% block styles %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block body %}
<main class="auth-card">
    <h1>New Password 🔒</h1>
    {% include "components/_flash_messages.html" %}

    <form action="{{ url_for('auth.reset_password') }}" method="post" class="auth-form">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="password">New password</label>
            <input id="password" type="password" name="password" placeholder="At least 8 characters" minlength="8" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-danger">Save & Update Password</button>
    </form>

    <p class="footer-link"><a href="{{ url_for('auth.login') }}">Cancel and go to Login</a></p>
</main>
{% endblock %}
