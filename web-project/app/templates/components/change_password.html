<div class="settings-card" data-page="change-password">
    <h2>🔑 Change Password</h2>
    {% include "components/_flash_messages.html" %}
    <form action="{{ url_for('auth.change_password_route') }}" method="post" id="changePasswordForm" class="settings-form">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="old_password">Old Password</label>
            <input type="password" id="old_password" name="old_password" placeholder="Enter old password" required autocomplete="current-password">
        </div>
        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" id="new_password" name="new_password" placeholder="At least 8 characters" minlength="8" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary">Update Password</button>
    </form>
    <a href="{{ url_for('main.budget') }}" class="back-link nav-link">← Back to Budget Tracker</a>
</div>
