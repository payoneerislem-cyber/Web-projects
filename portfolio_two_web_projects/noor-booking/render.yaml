services:
  - type: web
    name: noor-studio-booking-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SEED_DEMO_DATA
        value: true
      - key: COOKIE_SECURE
        value: true
      - key: BUSINESS_TIMEZONE
        value: Africa/Algiers
